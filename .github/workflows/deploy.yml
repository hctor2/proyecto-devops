name: Deploy EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Deploy por SSH hacia AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd proyecto-devops
            git pull origin main
            # Construimos una imagen con un ID único basado en el commit
            docker build -t proyecto-devops-web:${{ github.sha }} .
            # Actualizamos el servicio para que use esa imagen única y específica
            docker service update --force --image proyecto-devops-web:${{ github.sha }} devops_web
